<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yenken Mark</title>
  <desc id="desc">Stylised Y-shaped highway inside rounded square.</desc>

  <defs>
    <linearGradient id="yk-icon-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="yk-road-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Icon container -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#yk-icon-grad)"/>

  <!-- Y-shaped road arms -->
  <path d="M32 30 L18 10 L24 10 L36 28 Z" fill="url(#yk-road-grad)" />
  <path d="M32 30 L40 10 L46 10 L28 28 Z" fill="url(#yk-road-grad)" />

  <!-- Y stem -->
  <rect x="28" y="28" width="8" height="22" rx="3" fill="url(#yk-road-grad)" />

  <!-- Center dashed lane line -->
  <g stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round">
    <line x1="32" y1="30.5" x2="32" y2="34.5" />
    <line x1="32" y1="38.5" x2="32" y2="42.5" />
    <line x1="32" y1="46.5" x2="32" y2="49.5" />
    <line x1="28" y1="24" x2="26" y2="20.8" />
    <line x1="36" y1="24" x2="38" y2="20.8" />
  </g>
</svg>
